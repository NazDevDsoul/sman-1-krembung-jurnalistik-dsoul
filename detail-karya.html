<!-- 🔥 SCRIPT UTAMA -->
<script>
fetch('data/karya.json')
  .then(res => res.json())
  .then(data => {

    const params = new URLSearchParams(window.location.search);
    const id = parseInt(params.get("id"));

    if (isNaN(id) || id < 0 || id >= data.length) {
      document.body.innerHTML = "<h2>Karya tidak ditemukan</h2>";
      return;
    }

    const karya = data[id];

    // isi
    document.getElementById("judul").innerText = karya.judul;
    document.getElementById("tanggal").innerText = karya.tanggal;
    document.getElementById("kategori").innerText = karya.kategori;
    document.getElementById("gambar").src = karya.gambar;
    document.getElementById("breadcrumb").innerText = "Home > Karya > " + karya.judul;

    document.getElementById("isi").innerHTML = karya.isi;

    // 🔥 slider karya lain
    const container = document.getElementById("karyaSlider");

    function card(item){
      return `
        <a href="detail-karya.html?id=${item.id}" class="card-link">
          <div class="card">
            <img src="${item.gambar}">
            <h3>${item.judul}</h3>
            <p>${item.deskripsi}</p>
          </div>
        </a>
      `;
    }

    let html = "";
    data.forEach(item => html += card(item));
    data.forEach(item => html += card(item)); // infinite

    container.innerHTML = html;
  });
</script>

<!-- DRAG SLIDER -->
<script>
const track = document.querySelector('#karyaSlider');

let isDown = false;
let startX;
let scrollLeft;

track.addEventListener('mousedown', (e) => {
  isDown = true;
  startX = e.pageX - track.offsetLeft;
  scrollLeft = track.scrollLeft;
});

track.addEventListener('mouseup', () => isDown = false);
track.addEventListener('mouseleave', () => isDown = false);

track.addEventListener('mousemove', (e) => {
  if(!isDown) return;
  e.preventDefault();
  const x = e.pageX - track.offsetLeft;
  const walk = (x - startX) * 2;
  track.scrollLeft = scrollLeft - walk;
});

/* TOUCH */
track.addEventListener('touchstart', (e) => {
  startX = e.touches[0].pageX;
  scrollLeft = track.scrollLeft;
});

track.addEventListener('touchmove', (e) => {
  const x = e.touches[0].pageX;
  const walk = (x - startX) * 2;
  track.scrollLeft = scrollLeft - walk;
});
</script>

</body>
