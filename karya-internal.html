<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Karya Internal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/feather-icons"></script>

  <style>
    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 220px;
      gap: 12px;
      color: #0a3646;
    }

    .spinner {
      width: 42px;
      height: 42px;
      border: 4px solid rgba(10, 54, 70, 0.15);
      border-top: 4px solid var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>

<body>

<nav class="navbar">
  <div class="brand">
    <img src="img/logodsoul.png" class="logo" alt="logo">
    <a href="index.html" class="navbar-logo">
      sman1krembung<span>jurnalistik</span>.
    </a>
  </div>

  <div class="navbar-nav">
    <a href="index.html">Home</a>
    <a href="tentang-kami.html">Tentang</a>
    <a href="berita.html">Berita</a>
    <a href="karya.html">Karya</a>
    <a href="agenda.html">Agenda</a>
    <a href="index.html#contact">Kontak</a>
  </div>

  <div class="nav-right">
    <a href="#" id="hamburger-menu"><i data-feather="menu"></i></a>
  </div>
</nav>

<section class="karya-hero">
  <div class="karya-slider" id="karyaInternalSlider"></div>
  <div class="karya-overlay"></div>

  <div class="karya-content">
    <p class="label">Karya Internal</p>
    <h1>Karya Tim</h1>
    <p>Karya internal tim jurnalistik ditampilkan dari spreadsheet.</p>
  </div>
</section>

<section class="karya-wrapper">
  <div id="loading" class="loading">
    <div class="spinner"></div>
    <p>Memuat karya internal...</p>
  </div>

  <div class="filter">
    <button data-filter="all" class="active">Semua</button>
    <button data-filter="draft">Draft</button>
    <button data-filter="publikasi">Publikasi</button>
    <button data-filter="lainnya">Lainnya</button>
  </div>

  <div class="karya-grid" id="karyaInternalContainer"></div>
</section>

<div class="back-wrapper">
  <a href="index.html" class="back-btn">← Kembali ke Beranda</a>
</div>

<footer class="footer">
