<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Agenda Sekolah</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/feather-icons"></script>
</head>

<body class="agenda-page">

<!-- NAVBAR -->
<nav class="navbar">
  <div class="brand">
    <img src="img/logodsoul.png" class="logo">
    <a href="index.html" class="navbar-logo">
      sman1krembung<span>jurnalistik</span>.
    </a>
  </div>

  <div class="navbar-nav">
    <a href="index.html">Home</a>
    <a href="berita.html">Berita</a>
    <a href="karya.html">Karya</a>
    <a href="agenda.html" class="active">Agenda</a>
    <a href="index.html#contact">Kontak</a>
  </div>

  <div class="nav-right">
    <a href="#" id="hamburger-menu"><i data-feather="menu"></i></a>
  </div>
</nav>

<!-- HERO -->
<section class="agenda-hero">
  <div class="agenda-slider" id="agendaSlider"></div>
  <div class="agenda-overlay"></div>

  <div class="agenda-content">
    <p class="label">Jadwal Kegiatan</p>
    <h1>Agenda Sekolah</h1>
    <p>Informasi kegiatan terbaru SMAN 1 Krembung</p>
  </div>
</section>

<!-- CONTENT -->
<section class="agenda-wrapper">

  <div class="filter">
    <button data-filter="all" class="active">Semua</button>
    <button data-filter="upcoming">Akan Datang</button>
    <button data-filter="done">Selesai</button>
  </div>

  <div class="agenda-list" id="agendaContainer"></div>

</section>

<section class="calendar-wrapper">

  <div class="calendar-header">
    <button id="prevMonth">←</button>
    <h2 id="calendarTitle"></h2>
    <button id="nextMonth">→</button>
  </div>

  <div class="calendar" id="calendar"></div>

</section>

<!-- BACK -->
<div class="back-wrapper">
  <a href="index.html" class="back-btn">← Kembali ke Beranda</a>
</div>

<!-- FOOTER -->
<footer class="footer">
  <h3>SMAN 1 Krembung Jurnalistik</h3>
  <p>Menginformasikan kegiatan sekolah secara real-time</p>
</footer>

<script src="js/agenda.js"></script>
<script>feather.replace();</script>

</body>
</html>
