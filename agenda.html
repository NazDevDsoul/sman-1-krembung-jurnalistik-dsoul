<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Agenda Sekolah</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/feather-icons"></script>

  <style>
    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 220px;
      gap: 12px;
      color: #0a3646;
    }

    .spinner {
      width: 42px;
      height: 42px;
      border: 4px solid rgba(10, 54, 70, 0.15);
      border-top: 4px solid var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .agenda-link {
      color: inherit;
      text-decoration: none;
    }

    .agenda-link:hover {
      text-decoration: none;
    }
  </style>
</head>

<body class="agenda-page">

<nav class="navbar">
  <div class="brand">
    <img src="img/logodsoul.png" class="logo" alt="logo">
    <a href="index.html" class="navbar-logo">
      sman1krembung<span>jurnalistik</span>.
    </a>
  </div>

  <div class="navbar-nav">
    <a href="index.html">Home</a>
    <a href="berita.html">Berita</a>
    <a href="karya.html">Karya</a>
    <a href="agenda.html" class="active">Agenda</a>
    <a href="index.html#contact">Kontak</a>
  </div>

  <div class="nav-right">
    <a href="#" id="hamburger-menu"><i data-feather="menu"></i></a>
  </div>
</nav>

<section class="agenda-hero">
  <div class="agenda-slider" id="agendaSlider"></div>
  <div class="agenda-overlay"></div>

  <div class="agenda-content">
    <p class="label">Jadwal Kegiatan</p>
    <h1>Agenda Sekolah</h1>
    <p>Informasi kegiatan terbaru SMAN 1 Krembung</p>
  </div>
</section>

<section class="agenda-wrapper">
  <div id="loading" class="loading">
    <div class="spinner"></div>
    <p>Memuat agenda...</p>
  </div>

  <div class="filter">
    <button data-filter="all" class="active">Semua</button>
    <button data-filter="upcoming">Akan Datang</button>
    <button data-filter="ongoing">Berlangsung</button>
    <button data-filter="done">Selesai</button>
  </div>

  <div class="agenda-list" id="agendaContainer"></div>
</section>

<section class="calendar-wrapper">
  <div class="calendar-header">
    <button id="prevMonth">←</button>
    <h2 id="calendarTitle"></h2>
    <button id="nextMonth">→</button>
  </div>

  <div class="calendar" id="calendar"></div>
</section>

<div class="back-wrapper">
  <a href="index.html" class="back-btn">← Kembali ke Beranda</a>
</div>

<footer class="footer">
  <h3>SMAN 1 Krembung Jurnalistik</h3>
  <p>Menginformasikan kegiatan sekolah secara real-time</p>
</footer>

<script src="js/api.js"></script>
<script src="js/agenda.js"></script>

<script>
  feather.replace();

  document.addEventListener("DOMContentLoaded", () => {
    const hamburger = document.getElementById("hamburger-menu");
    const navMenu = document.querySelector(".navbar-nav");

    if (hamburger && navMenu) {
      hamburger.addEventListener("click", (e) => {
        e.preventDefault();
        navMenu.classList.toggle("active");
      });
    }
  });
</script>

</body>
</html>
